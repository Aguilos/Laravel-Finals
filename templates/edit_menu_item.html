{% extends "base.html" %}

{% block title %}Edit Menu Item - Coffee Shop{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="fas fa-edit"></i> Edit Menu Item</h1>
    <a href="{{ url_for('menu') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Back
    </a>
</div>

<div class="form-container">
    <form method="POST" class="form">
        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" value="{{ item.name }}" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3">{{ item.description or '' }}</textarea>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" name="category" required>
                    <option value="">Select category</option>
                    <option value="coffee" {% if item.category == 'coffee' %}selected{% endif %}>Coffee</option>
                    <option value="tea" {% if item.category == 'tea' %}selected{% endif %}>Tea</option>
                    <option value="pastry" {% if item.category == 'pastry' %}selected{% endif %}>Pastry</option>
                    <option value="sandwich" {% if item.category == 'sandwich' %}selected{% endif %}>Sandwich</option>
                    <option value="dessert" {% if item.category == 'dessert' %}selected{% endif %}>Dessert</option>
                    <option value="other" {% if item.category == 'other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="price">Price (₱) *</label>
                <input type="number" id="price" name="price" step="0.01" min="0" value="{{ item.price }}" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="cost">Cost (₱) *</label>
                <input type="number" id="cost" name="cost" step="0.01" min="0" value="{{ item.cost }}" required>
            </div>
            
            <div class="form-group">
                <label for="stock_quantity">Stock Quantity *</label>
                <input type="number" id="stock_quantity" name="stock_quantity" min="0" value="{{ item.stock_quantity }}" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="low_stock_threshold">Low Stock Threshold</label>
            <input type="number" id="low_stock_threshold" name="low_stock_threshold" value="{{ item.low_stock_threshold }}" min="0">
        </div>
        
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="is_available" {% if item.is_available %}checked{% endif %}>
                Available for ordering
            </label>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Update Item
            </button>
            <a href="{{ url_for('menu') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
