{% extends "base.html" %}

{% block title %}Verify 2FA - Coffee Shop{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <i class="fas fa-shield-alt"></i>
            <h1>Two-Factor Authentication</h1>
            <p>Enter the 6-digit code from your authenticator app</p>
        </div>
        
        <form method="POST" class="login-form">
            <div class="form-group">
                <label for="code"><i class="fas fa-key"></i> Verification Code</label>
                <input type="text" id="code" name="code" maxlength="6" pattern="[0-9]{6}" required autofocus>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-check"></i> Verify
            </button>
        </form>
        
        <div class="login-footer">
            <a href="{{ url_for('logout') }}">Cancel and logout</a>
        </div>
    </div>
</div>
{% endblock %}
